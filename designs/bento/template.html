<!--
  Variante de design « BENTO » du dashboard v2 — template rendu par generate_dashboard.py
  (--template designs/bento/template.html). Le modèle JSON est injecté dans #dash-data.
  Palette de séries (validée CVD, validate_palette.js, ALL CHECKS PASS) :
    clair  (surface #ffffff) : #5b5bd6 · #e8663a · #0f9e8b · #c08a00
    sombre (surface #15161c) : #7173e8 · #e0673a · #16a88f · #bb8700
-->
<script>
  // Thème appliqué avant le rendu (pas de flash) — même préférence que la v2
  try { var th = localStorage.getItem("vrp-theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch (e) {}
</script>
<style>
:root {
  color-scheme: light;
  --page:#eef0f5; --card:rgba(255,255,255,.86); --card-solid:#ffffff; --card-2:#f4f5f9; --card-3:#eceef4;
  --line:rgba(17,20,35,.08); --line-2:rgba(17,20,35,.15); --hi:rgba(255,255,255,.95);
  --ink:#0d0f16; --ink-2:#454957; --muted:#676c7b;
  --grid:#e9eaf0; --axis:#c6c9d4; --track:#e8eaf1; --band:#dfe9fb;
  --s1:#5b5bd6; --s2:#e8663a; --s3:#0f9e8b; --s4:#c08a00; --accent:#5b5bd6;
  --pos:#0b7a3b; --neg:#c43333; --pos-mark:#1f9d55; --neg-mark:#e0484b;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --idle:#9095a4; --info:#5b5bd6; --na:#9095a4;
  --glow-good:#10b981; --glow-warning:#f59e0b; --glow-critical:#ef4444; --glow-idle:#6366f1;
  --shadow:0 1px 2px rgba(20,24,40,.04), 0 8px 24px -10px rgba(20,24,40,.10), 0 22px 44px -28px rgba(20,24,40,.16);
  --shadow-lift:0 2px 4px rgba(20,24,40,.05), 0 18px 40px -12px rgba(20,24,40,.20), 0 36px 64px -32px rgba(20,24,40,.24);
  --blob1:rgba(99,102,241,.22); --blob2:rgba(20,184,166,.16); --blob3:rgba(251,146,60,.13);
  --thumb:#ffffff; --thumb-shadow:0 1px 2px rgba(0,0,0,.08), 0 3px 10px -3px rgba(0,0,0,.14);
  --spot:rgba(91,91,214,.07);
  --f-ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-disp:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --r:26px; --r-in:16px; --gap:14px; --pad:18px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:#07080c; --card:rgba(24,25,33,.78); --card-solid:#15161c; --card-2:rgba(255,255,255,.045); --card-3:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.15); --hi:rgba(255,255,255,.07);
    --ink:#f3f4f7; --ink-2:#bdc0cc; --muted:#8f93a2;
    --grid:#23252e; --axis:#3a3d4a; --track:#262833; --band:#1d2440;
    --s1:#7173e8; --s2:#e0673a; --s3:#16a88f; --s4:#bb8700; --accent:#7173e8;
    --pos:#43d186; --neg:#ff7b7b; --pos-mark:#2fb56d; --neg-mark:#f0585c;
    --idle:#6f7486; --info:#7173e8; --na:#6f7486;
    --shadow:0 0 0 1px rgba(255,255,255,.015), 0 14px 34px -16px rgba(0,0,0,.75);
    --shadow-lift:0 0 0 1px rgba(255,255,255,.03), 0 26px 56px -20px rgba(0,0,0,.9);
    --blob1:rgba(99,102,241,.26); --blob2:rgba(20,184,166,.13); --blob3:rgba(236,72,153,.10);
    --thumb:rgba(255,255,255,.13); --thumb-shadow:0 1px 2px rgba(0,0,0,.4);
    --spot:rgba(113,115,232,.10);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#07080c; --card:rgba(24,25,33,.78); --card-solid:#15161c; --card-2:rgba(255,255,255,.045); --card-3:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.15); --hi:rgba(255,255,255,.07);
  --ink:#f3f4f7; --ink-2:#bdc0cc; --muted:#8f93a2;
  --grid:#23252e; --axis:#3a3d4a; --track:#262833; --band:#1d2440;
  --s1:#7173e8; --s2:#e0673a; --s3:#16a88f; --s4:#bb8700; --accent:#7173e8;
  --pos:#43d186; --neg:#ff7b7b; --pos-mark:#2fb56d; --neg-mark:#f0585c;
  --idle:#6f7486; --info:#7173e8; --na:#6f7486;
  --shadow:0 0 0 1px rgba(255,255,255,.015), 0 14px 34px -16px rgba(0,0,0,.75);
  --shadow-lift:0 0 0 1px rgba(255,255,255,.03), 0 26px 56px -20px rgba(0,0,0,.9);
  --blob1:rgba(99,102,241,.26); --blob2:rgba(20,184,166,.13); --blob3:rgba(236,72,153,.10);
  --thumb:rgba(255,255,255,.13); --thumb-shadow:0 1px 2px rgba(0,0,0,.4);
  --spot:rgba(113,115,232,.10);
}

/* ── Base ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; scroll-padding-top:84px; }
body { margin:0; min-height:100vh; background:var(--page); color:var(--ink); font:400 14px/1.5 var(--f-ui);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
a { color:inherit; }
button { font:inherit; color:inherit; }
h1, h2, h3, p { margin:0; }
.muted { color:var(--muted); } .ink2 { color:var(--ink-2); }
.pos { color:var(--pos); } .neg { color:var(--neg); }
.tnum { font-variant-numeric:tabular-nums; }
.mono { font-family:var(--f-mono); font-size:.93em; letter-spacing:-.01em; }
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }

/* Aurora : halos doux derrière la grille */
.aurora { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.aurora i { position:absolute; border-radius:50%; filter:blur(20px); }
.aurora i:nth-child(1) { width:62vmax; height:48vmax; left:-16vmax; top:-18vmax; background:radial-gradient(closest-side, var(--blob1), transparent); }
.aurora i:nth-child(2) { width:54vmax; height:44vmax; right:-18vmax; top:4vmax; background:radial-gradient(closest-side, var(--blob2), transparent); }
.aurora i:nth-child(3) { width:70vmax; height:50vmax; left:18vmax; bottom:-30vmax; background:radial-gradient(closest-side, var(--blob3), transparent); }
@media (prefers-reduced-motion: no-preference) {
  .aurora i:nth-child(1) { animation:drift1 38s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { animation:drift2 46s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform:translate(8vmax, 6vmax) scale(1.08); } }
  @keyframes drift2 { to { transform:translate(-6vmax, 8vmax) scale(.94); } }
}

/* ── Barre d'application (verre dépoli, collante) ─────────────────────── */
.appbar { position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--page) 70%, transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.6); backdrop-filter:blur(22px) saturate(1.6); border-bottom:1px solid var(--line); }
.ab-in { max-width:1380px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px; min-height:60px; }
.brand { display:flex; align-items:center; gap:10px; text-decoration:none; min-width:0; }
.brand svg { flex:none; display:block; }
.brand-t { font:600 16px/1 var(--f-disp); letter-spacing:-.01em; white-space:nowrap; }
.pill { font:600 10.5px/1 var(--f-ui); letter-spacing:.06em; text-transform:uppercase; padding:5px 8px; border-radius:999px;
  background:var(--card-2); color:var(--ink-2); border:1px solid var(--line); white-space:nowrap; }
.mini { display:flex; align-items:center; gap:8px; font:600 13px/1 var(--f-ui); opacity:0; transform:translateY(-6px);
  transition:opacity .35s var(--ease), transform .35s var(--ease); pointer-events:none; white-space:nowrap; min-width:0; }
.mini.on { opacity:1; transform:none; }
.mini .dot { width:18px; height:18px; border-radius:50%; background:var(--lvl); color:#fff; display:grid; place-items:center; font-size:10px; font-weight:700; flex:none; }
.mini.lvl-warning .dot, .mini.lvl-idle .dot { color:#14120a; }
.ab-r { margin-left:auto; display:flex; align-items:center; gap:8px; flex:none; }
.seg-l { font-size:12px; color:var(--muted); }
.iconbtn { width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card-2); color:var(--ink-2);
  display:grid; place-items:center; cursor:pointer; transition:transform .3s var(--ease), background .2s, color .2s; }
.iconbtn:hover { color:var(--ink); background:var(--card-3); }
.iconbtn:active { transform:scale(.94); }
.iconbtn svg { transition:transform .5s var(--ease); }
.iconbtn:hover svg { transform:rotate(-20deg); }
@media (max-width:560px) { .pill, .seg-l { display:none; } .mini .mtxt { display:none; } }
@media (max-width:380px) { .brand-t { display:none; } }

/* Contrôle segmenté à pouce glissant */
.seg { position:relative; display:inline-flex; padding:3px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); flex:none; }
.seg-b { position:relative; z-index:1; border:0; background:none; cursor:pointer; padding:6px 12px; border-radius:999px;
  font:600 12.5px/1.2 var(--f-ui); color:var(--muted); transition:color .25s; white-space:nowrap; }
.seg-b:hover { color:var(--ink-2); }
.seg-b[aria-pressed="true"] { color:var(--ink); }
.seg-thumb { position:absolute; z-index:0; top:3px; bottom:3px; left:0; width:0; border-radius:999px; background:var(--thumb);
  box-shadow:var(--thumb-shadow); transition:transform .45s var(--ease), width .45s var(--ease); }

/* ── Mise en page ─────────────────────────────────────────────────────── */
.wrap { max-width:1380px; margin:0 auto; padding:0 16px 56px; }
.intro { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px 24px; padding:28px 4px 20px; }
.kicker { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); font-weight:500; }
.title { font:700 clamp(34px, 3.2vw + 18px, 56px)/1 var(--f-disp); letter-spacing:-.035em; margin-top:8px;
  background:linear-gradient(100deg, var(--ink) 30%, color-mix(in srgb, var(--ink) 55%, var(--accent)) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.lede { margin-top:8px; color:var(--ink-2); font-size:14px; }
.links { display:flex; flex-wrap:wrap; gap:6px; }
.lnk { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; font:500 13px/1.2 var(--f-ui);
  text-decoration:none; color:var(--ink-2); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); transition:transform .3s var(--ease), color .2s, border-color .2s; }
.lnk:hover { color:var(--ink); border-color:var(--line-2); transform:translateY(-1px); }
.lnk svg { opacity:.7; }

.sec-h { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:8px 16px; margin:48px 4px 16px; }
.sec-h h2 { font:650 clamp(22px, 1.2vw + 16px, 30px)/1.1 var(--f-disp); font-weight:600; letter-spacing:-.025em; }
.sec-h p { margin-top:6px; color:var(--muted); font-size:14px; max-width:62ch; }
.sec-note { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2); padding:6px 10px; border-radius:999px;
  background:var(--card-2); border:1px solid var(--line); }

.bento { display:grid; gap:var(--gap); grid-template-columns:repeat(2, minmax(0,1fr)); }
.bento > .card { grid-column:span var(--sm, 2); }
@media (min-width:720px) {
  :root { --gap:16px; --pad:22px; }
  .bento { grid-template-columns:repeat(6, minmax(0,1fr)); }
  .bento > .card { grid-column:span var(--md, 6); }
  .wrap, .ab-in { padding-left:24px; padding-right:24px; }
}
@media (min-width:1100px) {
  .bento { grid-template-columns:repeat(12, minmax(0,1fr)); }
  .bento > .card { grid-column:span var(--lg, 12); }
  .bento > .card.tall { grid-row:span 2; }
}

/* ── Carte ─────────────────────────────────────────────────────────────── */
.card { position:relative; isolation:isolate; min-width:0; container-type:inline-size; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); padding:var(--pad); box-shadow:var(--shadow), inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4);
  transition:transform .45s var(--ease), box-shadow .45s var(--ease), border-color .3s; }
.card::before { content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; pointer-events:none; opacity:0; transition:opacity .4s;
  background:radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), var(--spot), transparent 60%); }
@media (hover:hover) { .card:hover::before { opacity:1; } .card:hover { border-color:var(--line-2); } }
@media (hover:hover) and (prefers-reduced-motion:no-preference) {
  .card.lift:hover { transform:translateY(-4px); box-shadow:var(--shadow-lift), inset 0 1px 0 var(--hi); }
}
@media (prefers-reduced-motion:no-preference) {
  .card { animation:rise .75s var(--ease) backwards; animation-delay:calc(var(--i, 0) * 45ms); }
  @keyframes rise { from { opacity:0; transform:translateY(16px) scale(.985); } }
}
.ch { display:flex; align-items:flex-start; justify-content:space-between; gap:10px 12px; margin-bottom:14px; flex-wrap:wrap; }
.ch-l { display:flex; align-items:flex-start; gap:12px; min-width:0; flex:1 1 220px; }
.ch-r { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ico { width:32px; height:32px; border-radius:11px; flex:none; display:grid; place-items:center; color:var(--ink-2);
  background:var(--card-2); border:1px solid var(--line); }
.ct { font:600 16.5px/1.25 var(--f-disp); letter-spacing:-.012em; margin-top:1px; }
.cs { color:var(--muted); font-size:12.5px; margin-top:3px; line-height:1.45; }
.lbl { font:500 12.5px/1.3 var(--f-ui); color:var(--ink-2); }
.card-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; flex-wrap:wrap; }
.empty { display:grid; place-items:center; gap:8px; min-height:140px; padding:16px; text-align:center; color:var(--muted); font-size:13px;
  border-radius:var(--r-in); background:var(--card-2); border:1px dashed var(--line-2); }
.empty svg { opacity:.6; }
.err { max-width:640px; margin:48px auto; }

/* Badges de niveau (icône + libellé, jamais la couleur seule) */
.lvl-good { --lvl:var(--good); } .lvl-warning { --lvl:var(--warning); } .lvl-critical { --lvl:var(--critical); }
.lvl-idle { --lvl:var(--idle); } .lvl-info { --lvl:var(--info); } .lvl-serious { --lvl:var(--serious); } .lvl-na { --lvl:var(--na); }
.badge { display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 4px; border-radius:999px; white-space:nowrap;
  font:600 12px/1.2 var(--f-ui); color:var(--ink); background:color-mix(in srgb, var(--lvl) 15%, transparent); }
.badge i { width:17px; height:17px; border-radius:50%; background:var(--lvl); color:#fff; display:grid; place-items:center; font:700 9.5px/1 var(--f-ui); font-style:normal; }
.lvl-warning.badge i, .lvl-idle.badge i, .lvl-na.badge i { color:#14120a; }
.chip { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font:500 12px/1.3 var(--f-ui);
  color:var(--ink-2); background:var(--card-2); border:1px solid var(--line); white-space:nowrap; }
.chip b { color:var(--ink); font-weight:600; }
.chip.up b, .chip.up { color:var(--pos); } .chip.down b, .chip.down { color:var(--neg); }

/* Repli (cartes dépliables) */
.fold-b { display:inline-flex; align-items:center; gap:6px; padding:6px 10px 6px 8px; border-radius:999px; border:1px solid var(--line);
  background:var(--card-2); color:var(--ink-2); cursor:pointer; font:500 12.5px/1.2 var(--f-ui); transition:background .2s, color .2s; }
.fold-b:hover { color:var(--ink); background:var(--card-3); }
.fold-b svg { transition:transform .35s var(--ease); }
.fold-b[aria-expanded="true"] svg { transform:rotate(90deg); }
.fold { display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows .45s var(--ease), opacity .35s var(--ease); }
.fold[data-open="true"] { grid-template-rows:1fr; opacity:1; }
.fold-in { overflow:hidden; min-height:0; }
.fold-in > * { margin-top:12px; }

/* Tableaux (chiffres tabulaires, défilement dans la carte) */
.tscroll { overflow-x:auto; margin:0 calc(-1 * var(--pad)); padding:0 var(--pad); scrollbar-width:thin; }
.tmax { max-height:320px; overflow:auto; }
.tbl { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; font-variant-numeric:tabular-nums; }
.tbl th { text-align:left; font:500 11.5px/1.3 var(--f-ui); color:var(--muted); padding:8px 12px; border-bottom:1px solid var(--grid);
  white-space:nowrap; position:sticky; top:0; background:var(--card-solid); z-index:1; }
.tbl td { padding:10px 12px; border-bottom:1px solid var(--grid); white-space:nowrap; vertical-align:middle; }
.tbl th:first-child, .tbl td:first-child { padding-left:4px; }
.tbl th:last-child, .tbl td:last-child { padding-right:4px; }
.tbl .r { text-align:right; }
.tbl tbody tr:last-child td { border-bottom:0; }
.tbl tbody tr { transition:background .2s; }
.tbl tbody tr:hover td { background:color-mix(in srgb, var(--card-2) 100%, transparent); }
.tbl tr.click { cursor:pointer; }
.tbl tr.click td:first-child { position:relative; }
.tbl tr.hl td { background:color-mix(in srgb, var(--accent) 7%, transparent); }
.tbl tr.det td { background:var(--card-2); padding:4px 12px 14px; white-space:normal; }
.caret { display:inline-grid; place-items:center; width:18px; height:18px; color:var(--muted); transition:transform .3s var(--ease); vertical-align:middle; }
tr[aria-expanded="true"] .caret { transform:rotate(90deg); }
@media (prefers-reduced-motion:no-preference) { .tbl tr.det > td > div { animation:fadein .4s var(--ease); } @keyframes fadein { from { opacity:0; transform:translateY(-4px); } } }

/* Légende */
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--ink-2); margin:-4px 0 10px; }
.legend .key { display:inline-flex; align-items:center; gap:6px; }
.sw { display:inline-block; flex:none; }
.sw.line { width:14px; height:3px; border-radius:2px; }
.sw.rect { width:10px; height:10px; border-radius:3px; }
.sw.diamond { width:8px; height:8px; transform:rotate(45deg); border-radius:1px; }
.sw.dash { width:14px; height:0; border-top:2px dashed var(--ink-2); }
.sw.zone { width:12px; height:10px; border-radius:3px; opacity:.35; }

/* Graphiques */
.cbox { position:relative; height:250px; }
.chartcard { display:flex; flex-direction:column; }
.chartcard .cbox { flex:1 1 auto; height:auto; min-height:250px; }
@container (max-width:420px) { .cbox, .chartcard .cbox { min-height:220px; } }
.cbox canvas { display:block; position:absolute; inset:0; }
@media (prefers-reduced-motion:no-preference) { .cbox { transition:opacity .3s; } .cbox.busy { opacity:.35; } }

/* Anneaux de progression */
.ring-w { position:relative; flex:none; display:grid; place-items:center; }
.ring { position:absolute; inset:0; transform:rotate(-90deg); }
.ring-t { fill:none; stroke:var(--track); }
.ring-f { fill:none; stroke-linecap:round; }
@media (prefers-reduced-motion:no-preference) { .ring-f { transition:stroke-dasharray 1.2s var(--ease); } }
.ring-c { position:relative; font:600 13px/1 var(--f-disp); letter-spacing:-.01em; text-align:center; }

/* Mini-graphique (sparkline SVG + curseur HTML) */
.spk { position:relative; width:100%; touch-action:pan-y; outline-offset:4px; }
.spk svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.spk-line { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.spk-zero { stroke:var(--axis); stroke-width:1; }
.spk-ref { stroke:var(--ink-2); stroke-width:1; stroke-dasharray:3 4; opacity:.7; }
.spk-cur { position:absolute; top:0; bottom:0; width:1px; background:var(--axis); opacity:0; transition:opacity .15s; pointer-events:none; }
.spk-dot, .spk-end { position:absolute; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:var(--c); box-shadow:0 0 0 2px var(--card-solid); pointer-events:none; }
.spk-dot { opacity:0; transition:opacity .15s; }
.spk.on .spk-cur, .spk.on .spk-dot { opacity:1; }
.spk-end::after { content:""; position:absolute; inset:-5px; border-radius:50%; background:var(--c); opacity:.35; }
@media (prefers-reduced-motion:no-preference) { .spk-end::after { animation:ping 2.4s var(--ease) infinite; } @keyframes ping { from { transform:scale(.6); opacity:.45; } to { transform:scale(1.9); opacity:0; } } }
.spk-cap { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); margin-top:6px; min-height:18px; }
.spk-read { color:var(--ink-2); font-variant-numeric:tabular-nums; }

/* Barres horizontales (compteurs) */
.bar { position:relative; height:8px; border-radius:99px; background:var(--track); overflow:hidden; }
.bar > span { position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--c, var(--accent)); }
@media (prefers-reduced-motion:no-preference) { .bar > span { animation:grow 1.1s var(--ease) backwards; transform-origin:left; } @keyframes grow { from { transform:scaleX(0); } } }

/* ── Héro ─────────────────────────────────────────────────────────────── */
.hero { --glow:var(--glow-idle); padding:calc(var(--pad) + 4px); overflow:hidden;
  background:
    radial-gradient(120% 80% at 0% 0%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 58%),
    radial-gradient(90% 90% at 100% 110%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    var(--card); }
.hero.lvl-good { --glow:var(--glow-good); } .hero.lvl-warning { --glow:var(--glow-warning); }
.hero.lvl-critical { --glow:var(--glow-critical); } .hero.lvl-idle { --glow:var(--glow-idle); }
.hero::after { content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.35), transparent 40%); opacity:.5; }
:root[data-theme="dark"] .hero::after { opacity:.04; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .hero::after { opacity:.04; } }
.hero-in { display:grid; gap:20px; height:100%; grid-template-rows:auto 1fr auto auto; }
.hero-top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
.vchip { display:inline-flex; align-items:center; gap:10px; padding:6px 16px 6px 6px; border-radius:999px; font:600 15px/1.2 var(--f-disp);
  letter-spacing:-.01em; background:color-mix(in srgb, var(--lvl) 16%, var(--card-solid)); border:1px solid color-mix(in srgb, var(--lvl) 35%, transparent); }
.vchip-i { width:28px; height:28px; border-radius:50%; background:var(--lvl); color:#fff; display:grid; place-items:center; font:700 14px/1 var(--f-ui);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--lvl) 22%, transparent); }
.lvl-warning .vchip-i, .lvl-idle .vchip-i { color:#14120a; }
.beat { display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2); flex-wrap:wrap; }
.beat b { color:var(--ink); font-weight:600; }
.beat-dot { position:relative; width:9px; height:9px; border-radius:50%; background:var(--lvl); flex:none; }
.beat-dot::after { content:""; position:absolute; inset:0; border-radius:50%; background:var(--lvl); }
@media (prefers-reduced-motion:no-preference) { .beat-dot::after { animation:ping 1.8s var(--ease) infinite; } }
.hero-main { display:grid; gap:22px; align-items:end; }
@container (min-width:640px) { .hero-main { grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:28px; } }
.eyebrow-t { font:500 13px/1.3 var(--f-ui); color:var(--ink-2); }
.big { font:600 clamp(50px, 7.6cqi, 92px)/.95 var(--f-disp); letter-spacing:-.045em; margin:10px 0 12px; white-space:nowrap;
  background:linear-gradient(180deg, var(--ink) 35%, color-mix(in srgb, var(--ink) 62%, var(--glow)) 110%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.pnl-meta { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:12.5px; color:var(--ink-2); }
.tag { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font:600 12px/1.3 var(--f-ui); }
.tag.up { color:var(--pos); background:color-mix(in srgb, var(--pos-mark) 14%, transparent); }
.tag.down { color:var(--neg); background:color-mix(in srgb, var(--neg-mark) 14%, transparent); }
/* Cascade options → hedge → funding → frais → net */
.wf { display:grid; gap:7px; }
.wf-h { display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-bottom:2px; }
.wf-r { display:grid; grid-template-columns:minmax(76px, 30%) minmax(0,1fr) auto; align-items:center; gap:10px; font-size:12.5px; }
.wf-l { color:var(--ink-2); line-height:1.2; min-width:0; }
.wf-l small { display:block; font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wf-t { position:relative; height:14px; }
.wf-t::before { content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--grid); }
.wf-z { position:absolute; top:-4px; bottom:-4px; width:1px; background:var(--axis); }
.wf-b { position:absolute; top:1px; bottom:1px; min-width:3px; border-radius:4px; }
.wf-b.up { background:var(--pos-mark); } .wf-b.down { background:var(--neg-mark); }
.wf-b.net { background:var(--ink); top:0; bottom:0; }
.wf-v { font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; min-width:64px; }
.wf-r.total { padding-top:7px; border-top:1px dashed var(--line-2); }
.wf-r.total .wf-l { color:var(--ink); font-weight:600; }
@media (prefers-reduced-motion:no-preference) { .wf-b { animation:grow 1s var(--ease) backwards; animation-delay:calc(var(--k) * 90ms + 250ms); } }
.verdict { display:grid; gap:12px; padding-top:18px; border-top:1px solid var(--line); }
.lvls { display:flex; gap:4px; flex-wrap:wrap; }
.lv { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font:500 11.5px/1.2 var(--f-ui); color:var(--muted); background:var(--card-2); }
.lv i { width:7px; height:7px; border-radius:50%; background:var(--lvl); opacity:.45; }
.lv.on { color:var(--ink); font-weight:600; background:color-mix(in srgb, var(--lvl) 18%, var(--card-solid)); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--lvl) 40%, transparent); }
.lv.on i { opacity:1; box-shadow:0 0 0 3px color-mix(in srgb, var(--lvl) 25%, transparent); }
@container (max-width:470px) { .lv:not(.on) .lvt { display:none; } .lv:not(.on) { padding:4px 7px; } }
.v-lines { display:grid; gap:6px; }
.v-line { display:flex; gap:9px; align-items:flex-start; color:var(--ink-2); font-size:13.5px; }
.v-line svg { flex:none; margin-top:2px; color:var(--muted); }
.v-items { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.v-items li { display:flex; gap:10px; align-items:flex-start; font-size:13px; }
.v-items li .badge { margin-top:-1px; }

/* ── Tuiles marché / état ─────────────────────────────────────────────── */
.kpi { font:600 clamp(26px, 8cqi, 38px)/1.05 var(--f-disp); letter-spacing:-.03em; white-space:nowrap; }
.kpi small { font:500 14px/1 var(--f-ui); color:var(--muted); letter-spacing:0; margin-left:4px; }
.kpi-row { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.foot { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5; }
.foot b { color:var(--ink-2); font-weight:600; }
.vrp-bars { display:grid; gap:9px; margin-top:14px; }
.vb { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; font-size:12.5px; }
.vb .lbl { min-width:72px; }
.vb b { font-variant-numeric:tabular-nums; font-weight:600; min-width:38px; text-align:right; }
.vol-grid { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center; }
.tile { display:flex; flex-direction:column; }
.tile .grow { flex:1; }
.tile-body { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
@container (max-width:200px) { .kpi { font-size:22px; } .tile-body { gap:10px; } .ico { display:none; } .ch-l { gap:0; } }
.gauge { position:relative; height:26px; margin-top:12px; }
.gauge .g-track { position:absolute; left:0; right:0; top:9px; height:8px; border-radius:99px; background:var(--track); }
.gauge .g-band { position:absolute; top:9px; height:8px; background:var(--band); }
.gauge .g-fill { position:absolute; top:9px; height:8px; border-radius:99px; background:var(--c); }
.gauge .g-tick { position:absolute; top:4px; height:18px; width:2px; margin-left:-1px; border-radius:1px; background:var(--ink-2); }
.gauge .g-zero { position:absolute; top:6px; height:14px; width:1px; background:var(--axis); }
.gauge .g-dot { position:absolute; top:6px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px var(--card-solid); }
.g-lab { position:relative; height:14px; font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.g-lab span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
.state { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2); margin-top:8px; }
.state i { width:16px; height:16px; border-radius:50%; background:var(--lvl); color:#fff; font:700 9px/16px var(--f-ui); text-align:center; font-style:normal; flex:none; }
.lvl-warning.state i, .lvl-idle.state i { color:#14120a; }
.cmp { display:grid; gap:8px; margin-top:12px; }
.cmp-r { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; font-size:12px; color:var(--ink-2); }
.cmp-r .bar { grid-column:1 / -1; height:6px; }
.cmp-r b { color:var(--ink); font-variant-numeric:tabular-nums; }
.shield { display:flex; align-items:center; gap:12px; margin-top:4px; }
.shield-i { width:46px; height:46px; border-radius:15px; display:grid; place-items:center; color:#fff; background:var(--lvl); flex:none;
  box-shadow:0 8px 20px -8px color-mix(in srgb, var(--lvl) 80%, transparent); }
.lvl-warning .shield-i, .lvl-idle .shield-i { color:#14120a; }
.shield > div { min-width:0; display:grid; gap:6px; justify-items:start; }
.shield .badge { white-space:normal; }
@container (max-width:200px) { .shield-i { display:none; } }
.dl { display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 12px; font-size:12.5px; margin:0; }
.dl dt { color:var(--muted); } .dl dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); }

/* ── Entrées ─────────────────────────────────────────────────────────── */
.steps { list-style:none; margin:0; padding:0; display:grid; }
.step { position:relative; display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:4px 12px; align-items:center; padding:9px 0; }
.step::before { content:""; position:absolute; left:13.5px; top:-9px; height:18px; width:1px; background:var(--line-2); }
.step:first-child::before { display:none; }
.step-n { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font:700 12px/1 var(--f-ui); color:#fff; background:var(--lvl); position:relative; z-index:1; }
.step.skip .step-n { background:var(--card-3); color:var(--muted); }
.step-l { font-size:13.5px; min-width:0; }
.step-l small { display:block; color:var(--muted); font-size:11.5px; }
.step-d { font-size:12.5px; color:var(--ink-2); text-align:right; font-variant-numeric:tabular-nums; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.step.block .step-l { font-weight:600; }
@container (max-width:470px) { .step { grid-template-columns:28px minmax(0,1fr); } .step-d { grid-column:2; text-align:left; max-width:none; white-space:normal; margin-top:-2px; } }
.panel { margin-top:14px; padding:14px; border-radius:var(--r-in); background:var(--card-2); border:1px solid var(--line); }
.panel h4 { margin:0; font:600 14px/1.3 var(--f-disp); }
.panel p { font-size:12.5px; color:var(--ink-2); margin-top:4px; }
.comp { display:grid; gap:8px; margin-top:12px; }
.comp-r { display:grid; grid-template-columns:92px minmax(0,1fr) 38px; gap:10px; align-items:center; font-size:12px; color:var(--ink-2); }
.comp-r b { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); }
.comp-r.weak { color:var(--ink); font-weight:600; }
.gapline { display:flex; align-items:baseline; gap:8px; margin-top:12px; font-size:12.5px; color:var(--ink-2); flex-wrap:wrap; }
.gapline b { font:600 22px/1 var(--f-disp); letter-spacing:-.02em; color:var(--ink); }

/* ── Scanner ─────────────────────────────────────────────────────────── */
.strip { position:relative; margin:6px 0 4px; height:calc(var(--lanes) * 18px + 34px); }
.strip-axis { position:absolute; left:0; right:0; bottom:16px; height:1px; background:var(--axis); }
.strip-zone { position:absolute; top:0; bottom:16px; right:0; overflow:hidden; border-radius:0 12px 12px 0; background:color-mix(in srgb, var(--good) 9%, transparent);
  border-left:2px solid var(--ink); }
.strip-zone span { position:absolute; top:3px; left:8px; right:4px; font:600 11px/1.2 var(--f-ui); color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.strip-tk { position:absolute; bottom:0; font-size:10.5px; color:var(--muted); transform:translateX(-50%); font-variant-numeric:tabular-nums; }
.sdot { position:absolute; width:14px; height:14px; margin-left:-7px; padding:0; border-radius:50%; border:2px solid var(--ink-2); background:var(--card-solid);
  cursor:pointer; transition:transform .25s var(--ease), box-shadow .25s; }
.sdot::before { content:""; position:absolute; inset:-6px; border-radius:50%; }
.sdot.fill { background:var(--ink-2); }
.sdot.ok { border-color:var(--good); } .sdot.ok.fill { background:var(--good); }
.sdot:hover, .sdot.hl { transform:scale(1.35); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); z-index:2; }
.strip-key { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11.5px; color:var(--muted); margin-bottom:12px; }
.strip-key span { display:inline-flex; align-items:center; gap:6px; }
.strip-key i { width:10px; height:10px; border-radius:50%; border:2px solid var(--ink-2); display:inline-block; }
.strip-key i.fill { background:var(--ink-2); }
.score { display:flex; align-items:center; gap:10px; }
.score-v { display:block; font:600 19px/1 var(--f-disp); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.score-g { display:inline-flex; align-items:center; gap:3px; margin-top:4px; padding:2px 6px; border-radius:6px; font:600 11px/1.2 var(--f-ui); font-variant-numeric:tabular-nums;
  background:color-mix(in srgb, var(--lvl) 15%, transparent); color:var(--ink); white-space:nowrap; }
.score-g span { font-weight:500; color:var(--ink-2); }
.tbl td.sc { padding-top:9px; padding-bottom:9px; }
.tbl th.sc-h { color:var(--ink); font-weight:600; }
.sbar { position:relative; width:126px; height:10px; display:flex; gap:2px; border-radius:4px; background:var(--card-2); }
.sbar > span { height:10px; }
.sbar > span:first-child { border-radius:3px 0 0 3px; }
.sbar > span:last-of-type { border-radius:0 3px 3px 0; }
.sbar > span:only-of-type { border-radius:3px; }
.sbar .thr { position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--ink); border-radius:1px; }
.best { display:inline-flex; font:600 10px/1 var(--f-ui); letter-spacing:.04em; text-transform:uppercase; padding:3px 6px; border-radius:6px; margin-left:6px;
  color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); vertical-align:middle; }
.minis { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:8px; padding-top:6px; }
.mn { padding:8px 10px; border-radius:12px; background:var(--card-solid); border:1px solid var(--line); min-width:0; }
.mn span { display:block; font-size:11px; color:var(--muted); }
.mn b { font:600 13.5px/1.3 var(--f-ui); font-variant-numeric:tabular-nums; white-space:nowrap; }

/* ── Positions ───────────────────────────────────────────────────────── */
.pos-list { display:grid; gap:12px; }
.ptile { padding:16px; border-radius:20px; background:var(--card-2); border:1px solid var(--line); }
.pos-h { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 12px; align-items:flex-start; }
.instr { font:500 15px/1.25 var(--f-mono); letter-spacing:-.02em; }
.pos-sub { font-size:12.5px; color:var(--muted); margin-top:3px; }
.pos-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(118px, 1fr)); gap:8px; margin-top:14px; }
.pos-cap { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; align-items:center; margin-top:14px; font-size:12.5px; color:var(--ink-2); }
.pos-cap .bar { grid-column:1 / -1; height:8px; }
.tot-strip { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:8px; margin-bottom:14px; }

/* ── Risque ───────────────────────────────────────────────────────────── */
.mrow { padding:12px 0; border-bottom:1px solid var(--grid); }
.mrow:last-of-type { border-bottom:0; }
.mrow-h { display:flex; justify-content:space-between; gap:10px; font-size:13px; align-items:baseline; }
.mrow-h b { font:600 16px/1 var(--f-disp); font-variant-numeric:tabular-nums; }
.mtrack { position:relative; height:10px; border-radius:99px; background:var(--track); margin-top:10px; }
.mtrack .mf { position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--c); min-width:0; }
.mtrack .mt { position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--ink-2); border-radius:1px; }
.mticks { position:relative; height:18px; font-size:10.5px; color:var(--muted); }
.mticks span { position:absolute; top:4px; transform:translateX(-100%); white-space:nowrap; padding-right:4px; }
.mrest { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.summary { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin-bottom:14px; }

/* ── Performance ─────────────────────────────────────────────────────── */
.stats { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
.st { padding:14px; border-radius:18px; background:var(--card-2); border:1px solid var(--line); display:flex; flex-direction:column; gap:6px; min-width:0;
  transition:transform .35s var(--ease), background .3s; }
@media (hover:hover) and (prefers-reduced-motion:no-preference) { .st:hover { transform:translateY(-2px); background:var(--card-3); } }
.st-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.st-v { font:600 22px/1.1 var(--f-disp); letter-spacing:-.02em; white-space:nowrap; }
.st-m { font-size:11.5px; color:var(--muted); line-height:1.4; }
.roc { display:grid; gap:14px; }
@container (min-width:860px) { .roc { grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); align-items:start; } }
.rocbar { display:inline-block; width:56px; height:6px; border-radius:99px; background:var(--track); position:relative; vertical-align:middle; margin-left:8px; overflow:hidden; }
.rocbar > span { position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--c); }
.note { font-size:12.5px; color:var(--ink-2); line-height:1.55; padding:14px; border-radius:var(--r-in); background:var(--card-2); border:1px solid var(--line); }
.note b { color:var(--ink); }

/* ── Décisions / journal ─────────────────────────────────────────────── */
.reco { display:grid; gap:6px; padding:12px 0; border-bottom:1px solid var(--grid); }
.reco:last-of-type { border-bottom:0; }
.reco-h { display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
.reco-h b { font-weight:600; font-size:13.5px; }
.reco-v { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--ink-2); }

function waterfall() {

    { k: "Funding", sub: "encaissé / payé", v: T.funding || 0 },

  if (Math.abs(T.latent_options || 0) >= 0.5) steps.push({ k: "Latent", sub: "options ouvertes", v: T.latent_options });
  let acc = 0;

  return h("div", { class: "wf", role: "group", "aria-label": "Décomposition du PnL net" },

  if (SLOTS.vol) setTable(SLOTS.vol, ["Date", "DVOL", "HV blend", "Écart"], (SER.vol || []).filter(p => !cut || Date.parse(p.t) >= cut).slice().reverse()
    .map(p => [fdt(p.t), num(p.dvol, 1), num(p.hv, 1), p.dvol != null && p.hv != null ? signed(p.dvol - p.hv, 1) : "—"]));
  if (SLOTS.fund) setTable(SLOTS.fund, ["Date", "Funding annualisé"], (SER.funding || []).filter(p => !cut || Date.parse(p.t) >= cut).slice().reverse().map(p => [fdt(p.t), pct(p.v, 2, true)]));
}
function onRange() {
  document.querySelectorAll("[data-range-note]").forEach(e => { e.textContent = "Période : " + rangeLong(); });
  Object.values(SLOTS).forEach(sl => sl.box.classList.add("busy"));
  setTimeout(() => { renderCharts(); Object.values(SLOTS).forEach(sl => sl.box.classList.remove("busy")); }, REDUCED ? 0 : 140);
}

// ═══════════════════════════════════════════════════════════════════════════
// Routine & journal
// ═══════════════════════════════════════════════════════════════════════════
function decisionsCard() {
  const recos = DEC.recommendations || [];
  const kids = [head({ id: "dec", icon: "sliders", title: "Décisions en attente",
    sub: "Routine de backtests du " + fdate(DEC.generated_at) + " · " + (DEC.n_sweeps ?? "—") + " sweeps, 5 régimes",
    right: h("a", { class: "lnk", href: "backtest.html" }, "Détail", icon("chev", 13)) })];
  if (recos.length) {
    recos.forEach(r => kids.push(h("div", { class: "reco" },
      h("div", { class: "reco-h" }, h("b", {}, r.param),
        h("span", { class: "chip", title: "folds gagnés / total" }, h("span", { class: "folds", "aria-hidden": "true" }, Array.from({ length: r.n || 0 }, (_, k) => h("i", { class: k < (r.wins || 0) ? "w" : null }))),
          " robuste " + r.wins + "/" + r.n)),
      h("div", { class: "reco-v" }, h("span", { class: "muted" }, "actuel"), h("span", { class: "mono" }, frNum(r.current ?? "—")), "→", h("span", { class: "mono to" }, frNum(r.proposed ?? "—")),
        h("span", { class: "muted" }, "gain Calmar moyen " + (r.gain != null ? "+" + num(r.gain, 2) : "—"))))));
    kids.push(h("p", { class: "note", style: "margin-top:10px" }, "À appliquer à la main dans greeks_hedge.py (+ miroir backtest.py) — le test de synchro vérifie la cohérence."));
  } else {
    kids.push(h("p", { class: "note" }, "Aucune : la configuration actuelle reste la meilleure sur l'ensemble des régimes."));
  }
  const kidsFold = [];
  if ((DEC.inert || []).length) kidsFold.push(h("p", { class: "cs" }, "N'ont changé aucune décision dans l'historique simulé (garde-fous qui ne se déclenchent qu'en conditions extrêmes, ou mal vus par le backtest) :"),
    h("div", { class: "pchips" }, DEC.inert.map(x => h("span", { class: "chip" }, x))));
  const chip = (k, v) => h("span", { class: "chip" }, k + " ", h("b", {}, v));
  kids.push(h("h4", { class: "sub-h" }, "Paramètres live"),
    h("div", { class: "pchips" },
      chip("Seuil score", num(PR.ENTRY_SCORE_MIN, 2)), chip("Porte DVOL", "≥ " + num(PR.DVOL_MIN, 0)), chip("Cap", num(PR.MAX_PORTFOLIO_BTC, 1) + NB + "BTC"),
      chip("Poids", [PR.SCORE_W_IVHV, PR.SCORE_W_YIELD, PR.SCORE_W_SKEW].map(x => num(x, 2)).join(" / ")), chip("Convexité", num(PR.SIZE_CONVEXITY, 1)),
      chip("Plancher rang", num(PR.RANK_FLOOR, 1)), chip("Prime min", usd(PR.MIN_PREMIUM_USD)),
      chip("Allègement", MINUS + num(PR.CB_T1_MOVE_1D_PCT, 0) + " %/1 j · " + MINUS + num(PR.CB_T1_MOVE_3D_PCT, 0) + " %/3 j → garde " + num((PR.CB_T1_KEEP || 0) * 100, 0) + " %"),
      chip("Fermeture", MINUS + num(PR.CB_MOVE_3D_PCT, 0) + " %/3 j · DVOL +" + num(PR.CB_DVOL_3D_PTS, 0))));
  if (kidsFold.length) { const [fb, fr] = fold("Paramètres inertes (" + DEC.inert.length + ")", kidsFold); kids.push(h("div", { class: "card-foot" }, fb), fr); }
  return card({ id: "dec", lg: 5, md: 6, sm: 2 }, kids);
}
const REASON = { expiration: "Expiration", expired: "Expiration", expiry: "Expiration", cb_tier1_trim: "Allègement CB", circuit_breaker: "Fermeture CB", roll: "Roll" };
function journalCard() {
  const body = h("div", { class: "tscroll tmax", style: "max-height:420px" });
  const closedT = () => (J.closed || []).length ? table(["Date", "Instrument", "Raison", "BTC", "Prime", "PnL"],
    J.closed.map(c => [fdt(c.ts), h("span", {}, h("span", { class: "mono" }, c.instrument), c.lots > 1 ? h("span", { class: "muted" }, "  " + c.lots + " lots") : null),
      REASON[c.reason] || c.reason || "—", num(c.contracts, 3), usd(c.premium), money(c.pnl)]), { right: [false, false, false, true, true, true] })
    : empty("Aucune clôture sur 60 jours", "book");
  const hedgeT = () => (J.hedge || []).length ? table(["Date", "Sens", "Qté", "Prix", "Hedge après", "Réalisé"],
    J.hedge.map(e => [fdt(e.ts), e.side === "BUY" ? "▲ Achat" : "▼ Vente", num(Math.abs(e.qty), 4), usd(e.price), signed(e.qty_after, 4), e.realized != null ? money(e.realized) : "—"]),
    { right: [false, false, true, true, true, true] }) : empty("Aucun rebalancement", "swap");
  const show = (k) => body.replaceChildren(k === "hedge" ? hedgeT() : closedT());
  show("closed");
  const tabs = segmented([{ k: "closed", label: "Clôtures · " + (J.closed || []).length }, { k: "hedge", label: "Hedge · " + (J.hedge || []).length }], "closed", show, "Type d'événement");
  return card({ id: "jour", lg: 7, md: 6, sm: 2 },
    head({ id: "jour", icon: "book", title: "Journal", sub: "60 derniers jours · lots d'un même événement regroupés", right: tabs }), body);
}
function reconcileCard() {
  const r = RC; if (!r) return null;
  const ok = !r.n_mismatched && r.hedge && r.hedge.ok;
  return card({ id: "recon", lg: 12, md: 6, sm: 2 },
    head({ id: "recon", icon: "sync", title: "Réconciliation Deribit (" + (r.env || "?") + ")", sub: "Bot vs compte réel · " + (r.generated_at || ""),
      right: badge(ok ? "good" : "critical", ok ? "synchro" : (r.n_mismatched || 0) + " écart(s)") }),
    h("div", { class: "tscroll" }, table(["Instrument", "Bot", "Réel", "Écart", "Statut"],
      (r.positions || []).map(p => [h("span", { class: "mono" }, p.instrument), num(p.internal_qty, 4), num(p.real_qty, 4), signed(p.diff, 4), badge(p.status === "ok" ? "good" : "critical", p.status)]),
      { right: [false, true, true, true, false] })));
}

// ═══════════════════════════════════════════════════════════════════════════
// Assemblage
// ═══════════════════════════════════════════════════════════════════════════
function section(title, sub, note) {
  return h("div", { class: "sec-h" }, h("div", {}, h("h2", {}, title), sub ? h("p", {}, sub) : null),
    note ? h("span", { class: "sec-note", "data-range-note": "" }, icon("clock", 14), "Période : " + rangeLong()) : null);
}
function render() {
  renderAppbar();
  mount(APP,
    introEl(),
    h("div", { class: "bento" }, heroCard(), spotCard(), volCard(), expoTile(), deltaTile(), capitalTile(), cbTile()),
    section("Entrées & opportunités", "Pourquoi le bot entre, ou n'entre pas, au prochain run — et à quelle distance du seuil sont les candidats."),
    h("div", { class: "bento" }, entryCard(), scannerCard()),
    section("Book & risque", "Ce que le bot porte, et ce qui déclencherait le circuit breaker."),
    h("div", { class: "bento" }, positionsCard(), riskCard(), stressCard()),
    section("Performance", "La stratégie gagne-t-elle une fois le hedge, le funding et les frais payés ?", true),
    h("div", { class: "bento" },
      chartCard({ key: "perf", icon: "chart", title: "PnL réalisé cumulé", lg: 8, md: 6, legend: [{ name: "Net stratégie (après frais)", color: "var(--s1)" }, { name: "Options seules (brut)", color: "var(--s2)" }] }),
      statsCard(),
      chartCard({ key: "month", icon: "bars", title: "Attribution mensuelle", lg: 6, md: 6,
        legend: [{ name: "Options", color: "var(--s1)", kind: "rect" }, { name: "Hedge", color: "var(--s2)", kind: "rect" }, { name: "Funding", color: "var(--s3)", kind: "rect" },
          { name: "Frais", color: "var(--s4)", kind: "rect" }, { name: "Net", color: "var(--ink)", kind: "diamond" }] }),
      chartCard({ key: "cap", icon: "clock", title: "Capital immobilisé", sub: "Marge initiale Deribit reconstituée jour par jour (book et hedge de chaque clôture)", lg: 6, md: 6,
        legend: [{ name: "Marge standard", color: "var(--s1)" }, { name: "Portfolio margin (est.)", color: "var(--s2)" }] }),
      yieldCard()),
    section("Marché", "Spot, volatilité implicite vs réalisée, funding du perpétuel.", true),
    h("div", { class: "bento" },
      chartCard({ key: "spot", icon: "btc", title: "Spot BTC", lg: 4, md: 6 }),
      chartCard({ key: "vol", icon: "wave", title: "Vol implicite vs réalisée", sub: "Zone teintée = prime de risque de vol vendue (IV > HV) ou négative", lg: 4, md: 3,
        legend: [{ name: "DVOL (implicite 30 j)", color: "var(--s1)" }, { name: "HV blend 10/30 j", color: "var(--s2)" }] }),
      chartCard({ key: "fund", icon: "swap", title: "Funding du perpétuel", sub: "Annualisé, moyenne glissante 7 j — positif = le hedge short encaisse", lg: 4, md: 3 })),
    section("Routine & journal", "Décisions humaines en attente et derniers événements du bot."),
    h("div", { class: "bento" }, decisionsCard(), journalCard(), reconcileCard()));
  mount(document.getElementById("foot"),
    h("span", {}, "Généré le " + fdt(M.generated_at) + (TZ ? " (" + TZ + ")" : "")),
    h("span", {}, "Sources : positions.json · scan_entry.json · pnl_history.json · funding_history.jsonl · backtest_routine.json"),
    h("span", {}, "Mode " + (M.mode || "paper") + " — aucun ordre réel"),
    h("span", {}, h("a", { href: "index.html" }, "v1"), " · ", h("a", { href: "v2.html" }, "v2"), " · ", h("a", { href: "backtest.html" }, "backtests")));
  renderCharts();
  // Anneaux : animation de remplissage après le premier rendu
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll(".ring-f[data-to]").forEach(c => { c.style.strokeDasharray = c.getAttribute("data-to") + " 100"; })));
  // Statut compact dans la barre quand le héro sort de l'écran
  const hero = document.getElementById("hero"), mini = document.getElementById("mini");
  if (hero && mini && "IntersectionObserver" in window) new IntersectionObserver((es) => es.forEach(e => mini.classList.toggle("on", !e.isIntersecting)), { rootMargin: "-70px 0px 0px 0px" }).observe(hero);
  // Halo qui suit le pointeur sur les cartes
  document.addEventListener("pointermove", (e) => {
    const c = e.target && e.target.closest ? e.target.closest(".card") : null; if (!c) return;
    const r = c.getBoundingClientRect(); c.style.setProperty("--mx", (e.clientX - r.left) + "px"); c.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, { passive: true });
  if (window.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); const f = () => { if (!document.documentElement.getAttribute("data-theme")) { updateThemeBtn(); renderCharts(); } }; mq.addEventListener ? mq.addEventListener("change", f) : mq.addListener(f); }
}
render();
})();
</script>
