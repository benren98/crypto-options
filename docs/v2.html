<style>
/* Styles communs des dashboards (v2 live + backtests). Tokens de couleur : palette dataviz
   de référence, validée CVD en clair et en sombre. Injecté par les générateurs. */
:root {
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee; --ink:#0b0b0b; --ink-2:#52514e; --muted:#6f6d68;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --neg-mark:#e34948; --track:#cde2fb;
  --pos-text:#006300; --neg-text:#c42f2f;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --info:#2a78d6;
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#9a988f;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --neg-mark:#e66767; --track:#1d3a5f;
    --pos-text:#0ca30c; --neg-text:#e66767; --info:#3987e5;
    --shadow:none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#9a988f;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --neg-mark:#e66767; --track:#1d3a5f;
  --pos-text:#0ca30c; --neg-text:#e66767; --info:#3987e5;
  --shadow:none;
}
* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--page); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
a { color:var(--s1); text-decoration:none; } a:hover { text-decoration:underline; }
.wrap { max-width:1240px; margin:0 auto; padding:20px 16px 48px; }
.num, table.t td.r, .tick { font-variant-numeric:tabular-nums; }
h1,h2,h3 { margin:0; font-weight:600; }
.muted { color:var(--muted); } .ink2 { color:var(--ink-2); }
.pos { color:var(--pos-text); } .neg { color:var(--neg-text); }
.small { font-size:12px; }

/* Header */
.top { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin-bottom:16px; }
.brand { display:flex; align-items:center; gap:10px; }
.brand h1 { font-size:18px; letter-spacing:-.01em; }
.pill { font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--border); }
.botstatus { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.nav { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
.btn { font:inherit; font-size:13px; color:var(--ink-2); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.btn:hover { color:var(--ink); text-decoration:none; background:var(--surface-2); }
.btn[aria-pressed="true"] { color:var(--ink); background:var(--surface-2); border-color:var(--axis); font-weight:600; }

/* Cards & grids */
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:var(--shadow); min-width:0; }
.card h3 { font-size:14px; display:flex; align-items:center; gap:8px; }
.card .sub { color:var(--muted); font-size:12px; margin-top:2px; }
.cardhead { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr)); gap:16px; margin-top:16px; }
.grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:16px; margin-top:16px; }
.section { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:32px 0 0; }

/* Verdict */
.verdict { display:flex; gap:14px; align-items:flex-start; padding:16px 18px; border-radius:12px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); position:relative; overflow:hidden; }
.verdict::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--lvl); }
.verdict .icon { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:700; flex:none; color:#fff; background:var(--lvl); font-size:16px; }
.verdict h2 { font-size:20px; letter-spacing:-.01em; }
.verdict .lines { margin-top:4px; color:var(--ink-2); display:grid; gap:2px; }
.verdict ul { margin:10px 0 0; padding:0; list-style:none; display:grid; gap:6px; }
.verdict li { display:flex; gap:8px; align-items:baseline; }
.lvl-good { --lvl:var(--good); } .lvl-warning { --lvl:var(--warning); } .lvl-critical { --lvl:var(--critical); }
.lvl-idle { --lvl:var(--axis); } .lvl-info { --lvl:var(--info); } .lvl-serious { --lvl:var(--serious); }
.lvl-idle .icon { color:var(--ink); }
.badge { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:2px 8px 2px 6px; border-radius:999px; background:color-mix(in srgb, var(--lvl) 14%, transparent); color:var(--ink); white-space:nowrap; }
.badge i { font-style:normal; width:14px; height:14px; border-radius:50%; background:var(--lvl); color:#fff; display:grid; place-items:center; font-size:9px; }
.lvl-warning.badge i, .lvl-idle.badge i { color:#0b0b0b; }

/* KPI tiles */
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr)); gap:12px; margin-top:16px; }
.tile { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); min-width:0; }
.tile .label { font-size:12px; color:var(--ink-2); display:flex; justify-content:space-between; gap:8px; }
.tile .value { font-size:24px; font-weight:600; letter-spacing:-.02em; margin-top:4px; white-space:nowrap; }
.tile .meta { font-size:12px; color:var(--muted); margin-top:4px; display:grid; gap:2px; }
.tile.hero { grid-column:span 2; }
.tile.hero .value { font-size:44px; line-height:1.05; }
@media (max-width:560px) { .tile.hero { grid-column:span 1; } .tile.hero .value { font-size:36px; } }
.spark { display:block; margin-top:8px; width:100%; height:36px; }

/* Meters */
.meter { position:relative; height:8px; border-radius:4px; background:var(--track); margin-top:8px; }
.meter > span { position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--mfill, var(--s1)); }
.meter .tickmark { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink-2); border-radius:1px; }
.meterrow { display:grid; gap:2px; margin-bottom:14px; }
.meterrow .head { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
.meterrow .ticklabels { position:relative; height:16px; font-size:11px; color:var(--muted); }
.meterrow .ticklabels span { position:absolute; transform:translateX(-100%); white-space:nowrap; top:2px; }

/* Gates */
.gates { display:grid; gap:0; }
.gate { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--grid); font-size:13px; }
.gate:last-child { border-bottom:0; }
.gate .gi { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; flex:none; }
.gate .gl { flex:1; min-width:0; }
.gate .gd { color:var(--ink-2); text-align:right; font-variant-numeric:tabular-nums; }
.callout { margin-top:12px; padding:10px 12px; border-radius:8px; background:var(--surface-2); font-size:13px; color:var(--ink-2); }
.callout b { color:var(--ink); }

/* Tables */
.tscroll { overflow-x:auto; margin:0 -16px; padding:0 16px; }
table.t { width:100%; border-collapse:collapse; font-size:13px; }
table.t th { text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:6px 10px; border-bottom:1px solid var(--grid); white-space:nowrap; }
table.t td { padding:8px 10px; border-bottom:1px solid var(--grid); vertical-align:middle; white-space:nowrap; }
table.t th.r, table.t td.r { text-align:right; }
table.t tr:last-child td { border-bottom:0; }
table.t tbody tr.clickable { cursor:pointer; }
table.t tbody tr.clickable:hover td, table.t tbody tr:focus-visible td { background:var(--surface-2); }
table.t tr.sub td { background:var(--surface-2); padding:4px 10px 10px; }
table.t tr.sub table.t td, table.t tr.sub table.t th { background:transparent; padding:5px 10px; }
.caret { display:inline-block; width:12px; color:var(--muted); transition:transform .15s; }
tr[aria-expanded="true"] .caret { transform:rotate(90deg); }
.instr { font-weight:600; }
.progress { width:84px; height:6px; border-radius:3px; background:var(--track); position:relative; display:inline-block; vertical-align:middle; margin-left:8px; }
.progress span { position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--s1); }
.progress.neg span { background:var(--neg-mark); }

/* Score bars */
.sbar { position:relative; width:150px; height:10px; display:flex; gap:2px; background:var(--surface-2); border-radius:0 4px 4px 0; }
.sbar span { height:10px; }
.sbar span:first-child { border-radius:0; }
.sbar span:last-child { border-radius:0 4px 4px 0; }
.sbar .thr { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); border-radius:1px; }
.legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--ink-2); margin-bottom:8px; }
.legend .key { display:inline-flex; align-items:center; gap:6px; }
.legend .sw { display:inline-block; }
.legend .sw.line { width:14px; height:2px; border-radius:1px; }
.legend .sw.rect { width:10px; height:10px; border-radius:2px; }
.legend .sw.diamond { width:8px; height:8px; transform:rotate(45deg); }

/* Charts */
.chartbox { position:relative; height:240px; }
.empty { display:grid; place-items:center; height:100%; min-height:120px; color:var(--muted); font-size:13px; text-align:center; padding:12px; }
details.dt { margin-top:10px; font-size:12px; }
details.dt summary { cursor:pointer; color:var(--muted); }
details.dt .tscroll { max-height:260px; overflow:auto; margin-top:6px; }

/* Stats */
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px; margin-top:16px; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow); }
.stat .label { font-size:12px; color:var(--ink-2); }
.stat .value { font-size:20px; font-weight:600; margin-top:2px; letter-spacing:-.01em; }
.stat .meta { font-size:12px; color:var(--muted); margin-top:2px; }

.filters { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:32px; }
.filters .lbl { font-size:12px; color:var(--muted); margin-right:4px; }
.tabs { display:flex; gap:4px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { font-size:12px; padding:3px 8px; border-radius:6px; background:var(--surface-2); color:var(--ink-2); }
.chip b { color:var(--ink); font-weight:600; }
.reco { display:grid; gap:4px; padding:10px 0; border-bottom:1px solid var(--grid); }
.reco:last-child { border-bottom:0; }
.reco .arrow { color:var(--muted); margin:0 6px; }
footer { margin-top:32px; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 16px; }
.err { padding:24px; border-radius:12px; background:var(--surface); border:1px solid var(--border); }
@media print { .nav, .filters, details.dt { display:none; } }

const MINUS = "−";

const crosshair = {
  id: "vrpCrosshair",

      ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke();
      if (l.label) {

      const val = (p) => (p != null && typeof p === "object") ? p.y : p;
      let j = ds.data.length - 1; while (j >= 0 && val(ds.data[j]) == null) j--;

      pts.push({ x: meta.data[j].x, y: meta.data[j].y, v: val(ds.data[j]) });
    });

  const Y = v => ht - pad - (v - min) / span * (ht - 2 * pad);

  svg.setAttribute("class", "spark"); svg.setAttribute("aria-hidden", "true");

  zero.setAttribute("x1", pad); zero.setAttribute("x2", w - pad); zero.setAttribute("y1", Y(0)); zero.setAttribute("y2", Y(0));
  zero.setAttribute("stroke", css("--grid")); zero.setAttribute("stroke-width", "1"); svg.append(zero);
  const pl = document.createElementNS(ns, "polyline");

}

      const cv = canvasIn(box, "DVOL et volatilité réalisée", { endFmt: v => num(v, 1) });
      const gap = 13 * 3600 * 1000;   // le cron GitHub prend parfois plusieurs heures de retard
      CHARTS.push(new Chart(cv, { type: "line",
        data: { datasets: [lineDs("DVOL", xy(vol, "t", "dvol"), c1, true, gap), lineDs("HV blend", xy(vol, "t", "hv"), c2, true, gap)] },
        options: lineOpts(v => num(v, 1) + " %", fdt, v => num(v, 0) + " %") }));
    },
    { headers: ["Date", "DVOL", "HV blend"], rows: vol.slice().reverse().map(p => [fdt(p.t), p.dvol != null ? num(p.dvol, 1) : "—", p.hv != null ? num(p.hv, 1) : "—"]) });

  // 5. Funding annualisé
  const fund = (S.funding || []).filter(p => !cut || p.t >= cut);
  chartCard("mk-fund", "Funding du perpétuel", "Annualisé, moyenne glissante 7 j — positif = le hedge short encaisse", null,
    (box) => {
      if (fund.length < 2) return null;
      const cv = canvasIn(box, "Funding annualisé du BTC-PERPETUAL", { endFmt: v => pct(v, 1, true), refLines: [{ value: 0, color: css("--axis") }] });
      CHARTS.push(new Chart(cv, { type: "line",
        data: { datasets: [lineDs("Funding annualisé", xy(fund, "t", "v"), c1, true)] },
        options: lineOpts(v => pct(v, 2, true), fdt, v => pct(v, 0, true)) }));
    },
    { headers: ["Date", "Funding annualisé"], rows: fund.slice().reverse().map(p => [fdt(p.t), pct(p.v, 2, true)]) });
}

// ── Rendement du cash mobilisé (collatéral) ────────────────────────────────
function renderCapYield() {
  const c = D.capital || {}, sm = c.sm, pm = c.pm;
  const head = h("div", { class: "cardhead" }, h("div", {}, h("h3", {}, "Rendement du cash mobilisé"),
    h("div", { class: "sub" }, "PnL net de frais, annualisé, rapporté au capital à déposer (pic de marge initiale + pire drawdown)")));
  if (!sm) { mount("cap-yield", head, h("div", { class: "empty" }, "Pas encore d'historique de positions")); return; }
  const modes = [["idle", "Cash dormant (USDC, BTC non couvert)", "aucune rémunération des soldes dans la doc Deribit"],
                 ["tbill", "T-bills tokenisés (USYC / BUIDL)", "taux supposé " + pct(c.tbill_yield * 100, 1) + " · décote 2 % · accès souvent réservé aux investisseurs qualifiés"],
                 ["btc_funding", "BTC + short perp (cash-and-carry)", "encaisse le funding réel de la période ; neutre en $"]];
  const cell = (s, k) => s ? h("td", { class: "r num" }, h("b", { class: tone(s.roc_pct[k]) }, pct(s.roc_pct[k], 1)), h("span", { class: "muted small" }, "  +" + usd(s.carry_usd[k]))) : h("td", { class: "r muted" }, "—");
  mount("cap-yield", head,
    h("div", { class: "tscroll" }, h("table", { class: "t" },
      h("thead", {}, h("tr", {}, h("th", {}, "Collatéral"), h("th", { class: "r" }, "Marge standard"), h("th", { class: "r" }, "Portfolio margin (est.)"))),
      h("tbody", {},
        h("tr", {}, h("td", { class: "muted" }, "Capital à déposer"), h("td", { class: "r num" }, usd(sm.capital_usd)), h("td", { class: "r num" }, pm ? usd(pm.capital_usd) : "—")),
        modes.map(([k, lab, note]) => h("tr", {}, h("td", {}, lab, h("div", { class: "muted small" }, note)), cell(sm, k), cell(pm, k)))))),
    h("div", { class: "callout" }, "Marge standard (défaut Deribit) : chaque position est margée séparément, sans netting — le short perp du hedge ",
      "s'ajoute à la marge des puts. La portfolio margin stresse le book en bloc (±14 % × chocs de vol) et reconnaît le hedge ; ",
      "elle est sélectionnable dans le compte. Autres collatéraux acceptés : stETH (décote 7,5 %, exposition ETH à couvrir), USDe (5 %). ",
      "Estimation PM à confirmer via l'API privée (simulate_portfolio) une fois une clé en place."));
}

// ── Stats de performance ───────────────────────────────────────────────────
function renderPerfStats() {
  const p = D.performance, ev = p.events, br = ev.by_reason || {}, vb = p.vs_backtest;
  const stat = (label, value, meta) => h("div", { class: "stat" }, h("div", { class: "label" }, label), h("div", { class: "value" }, value), meta ? h("div", { class: "meta" }, meta) : null);
  const cbr = br.cb_tier1_trim, exp = br.expiration || br.expired;
  const ratio = vb.live_annual != null && vb.bt_annual ? vb.live_annual / vb.bt_annual : null;
  mount("perf-stats",
    stat("Prime conservée", p.kept_pct != null ? pct(p.kept_pct, 0) : "—", "part de la prime des options restée après hedge et funding"),
    stat("Événements gagnants", ev.n ? num(ev.wins / ev.n * 100, 0) + " %" : "—", ev.wins + " / " + ev.n + " clôtures (" + ev.lots + " lots)"),
    stat("Expirations", exp ? money(exp.pnl) : "—", exp ? exp.n + " événements" : ""),
    stat("Allègements CB", cbr ? money(cbr.pnl) : "—", cbr ? cbr.n + " rachats partiels" : "aucun"),
    stat("Frais estimés", money(p.totals.fees), "options " + usd(-(p.totals.fees_split?.options || 0)) + " · perp " + usd(-(p.totals.fees_split?.perp || 0)) +
      " · livraison " + usd(-(p.totals.fees_split?.livraison || 0))),
    stat("Live vs backtest (annualisé)", ratio != null ? pct(ratio * 100, 0) : "—",
      vb.live_annual != null ? "live " + usd(vb.live_annual, { sign: true, compact: true }) + "/an · backtest " + usd(vb.bt_annual, { sign: true, compact: true }) + "/an (optimiste)" : ""));
}

// ── Scanner ────────────────────────────────────────────────────────────────
const STATUS = { eligible: ["good", "éligible"], held: ["idle", "déjà tenu"], held_reentry: ["info", "ré-entrée possible"], filtered: ["idle", "filtré (proche d'une position)"] };
function renderScanner() {
  const s = D.scanner, rows = s.rows, thr = s.threshold, c = [css("--s1"), css("--s2"), css("--s3")];
  const scale = Math.max(0.7, thr * 1.4, ...rows.map(r => r.score));
  const head = h("div", { class: "cardhead" },
    h("div", {}, h("h3", {}, "Scanner — meilleurs candidats"),
      h("div", { class: "sub" }, "Barre = contribution pondérée de chaque composante au score · trait = seuil d'entrée " + num(thr, 2))));
  if (!rows.length) { mount("scanner", head, h("div", { class: "empty" }, "Aucun candidat au dernier scan")); return; }
  const lg = legend([{ name: "VRP (IV/HV) · poids " + num(s.weights.vrp, 2), color: c[0], kind: "rect" },
                     { name: "Yield ajusté · " + num(s.weights.yield, 2), color: c[1], kind: "rect" },
                     { name: "Skew · " + num(s.weights.skew, 2), color: c[2], kind: "rect" }]);
  const tb = h("tbody", {}, rows.map(r => {
    const segs = [r.contrib.vrp, r.contrib.yield, r.contrib.skew];
    const bar = h("div", { class: "sbar", title: "VRP " + num(segs[0], 3) + " · Yield " + num(segs[1], 3) + " · Skew " + num(segs[2], 3) },
      segs.map((v, i) => h("span", { style: "width:" + (v / scale * 100).toFixed(1) + "%;background:" + c[i] })),
      h("span", { class: "thr", style: "left:" + (thr / scale * 100).toFixed(1) + "%" }));
    const [lvl, txt] = STATUS[r.status] || ["idle", r.status];
    // Score en premier : c'est la colonne qu'on lit d'abord (écart au seuil visible d'un coup d'œil)
    return h("tr", {},
      h("td", { class: "r num" }, h("b", { class: r.score >= thr ? "pos" : "", style: "font-size:15px" }, num(r.score, 3)),
        h("div", { class: "muted small" }, (r.score >= thr ? "+" : MINUS) + num(Math.abs(r.score - thr), 3) + " vs seuil")),
      h("td", {}, bar),
      h("td", {}, h("span", { class: "instr" }, r.instrument)),
      h("td", {}, badge(lvl, txt), r.held_score != null ? h("span", { class: "muted small" }, "  tenu à " + num(r.held_score, 3)) : null),
      h("td", { class: "r num" }, num(r.tte_days, 1) + " j"),
      h("td", { class: "r num" }, pct(r.dist_pct, 1, true)),
      h("td", { class: "r num" }, usd(r.premium_usd)),
      h("td", { class: "r num" }, num(r.iv_hv, 2) + "×"),
      h("td", { class: "r num" }, sgn(r.skew_pct, 1, " %")));
  }));
  mount("scanner", head, lg, h("div", { class: "tscroll" }, h("table", { class: "t" },
    h("thead", {}, h("tr", {}, ["Score", "Contributions", "Instrument", "Statut", "TTE", "Distance", "Prime", "IV/HV", "Skew"].map((x, k) => h("th", { class: [0, 4, 5, 6, 7, 8].includes(k) ? "r" : "" }, x)))), tb)));
}

// ── Décisions + paramètres ─────────────────────────────────────────────────
function renderDecisions() {
  const d = D.decisions, P = D.meta.params;
  const kids = [h("div", { class: "cardhead" },
    h("div", {}, h("h3", {}, "Décisions en attente"), h("div", { class: "sub" }, "Routine de backtests du " + fdate(d.generated_at) + " · " + d.n_sweeps + " sweeps, 5 régimes")),
    h("a", { class: "btn", href: "backtest.html" }, "Détail →"))];
  if (d.recommendations.length) {
    kids.push(...d.recommendations.map(r => h("div", { class: "reco" },
      h("div", {}, badge("info", "robuste " + r.wins + "/" + r.n), "  ", h("b", {}, r.param)),
      h("div", { class: "num" }, h("span", { class: "muted" }, "actuel "), r.current, h("span", { class: "arrow" }, "→"), h("b", {}, r.proposed),
        h("span", { class: "muted" }, "   gain Calmar moyen " + (r.gain != null ? "+" + num(r.gain, 2) : "—"))))));
    kids.push(h("div", { class: "callout" }, "À appliquer à la main dans greeks_hedge.py (+ miroir backtest.py) — le test de synchro vérifie la cohérence."));
  } else {
    kids.push(h("div", { class: "callout" }, "Aucune : la configuration actuelle reste la meilleure sur l'ensemble des régimes."));
  }
  if (d.inert && d.inert.length) kids.push(h("div", { class: "sub", style: "margin-top:10px" },
    "N'ont changé aucune décision dans l'historique simulé (garde-fous qui ne se déclenchent qu'en conditions extrêmes, ou mal vus par le backtest) : " + d.inert.join(" · ")));
  const chip = (k, v) => h("span", { class: "chip" }, k + " ", h("b", {}, v));
  kids.push(h("h3", { style: "margin-top:16px" }, "Paramètres live"));
  kids.push(h("div", { class: "chips", style: "margin-top:8px" },
    chip("Seuil score", num(P.ENTRY_SCORE_MIN, 2)), chip("Porte DVOL", "≥ " + num(P.DVOL_MIN, 0)),
    chip("Cap", num(P.MAX_PORTFOLIO_BTC, 1) + " BTC"), chip("Poids", [P.SCORE_W_IVHV, P.SCORE_W_YIELD, P.SCORE_W_SKEW].map(x => num(x, 2)).join(" / ")),
    chip("Convexité", num(P.SIZE_CONVEXITY, 1)), chip("Plancher rang", num(P.RANK_FLOOR, 1)), chip("Prime min", usd(P.MIN_PREMIUM_USD)),
    chip("Allègement", "−" + num(P.CB_T1_MOVE_1D_PCT, 0) + "%/1j · −" + num(P.CB_T1_MOVE_3D_PCT, 0) + "%/3j → garde " + num(P.CB_T1_KEEP * 100, 0) + "%"),
    chip("Fermeture", "−" + num(P.CB_MOVE_3D_PCT, 0) + "%/3j · DVOL +" + num(P.CB_DVOL_3D_PTS, 0))));
  mount("decisions", kids);
}

// ── Journal ────────────────────────────────────────────────────────────────
const REASON = { expiration: "Expiration", expired: "Expiration", cb_tier1_trim: "Allègement CB", circuit_breaker: "Fermeture CB", roll: "Roll" };
let journalTab = "closed";
function renderJournal() {
  const j = D.journal;
  const tabs = h("div", { class: "tabs", role: "tablist" },
    [["closed", "Clôtures"], ["hedge", "Hedge"]].map(([k, l]) => h("button", { class: "btn", role: "tab", "aria-pressed": String(journalTab === k), "aria-selected": String(journalTab === k),
      onclick: () => { journalTab = k; renderJournal(); } }, l)));
  let body;
  if (journalTab === "closed") {
    body = j.closed.length ? h("table", { class: "t" },
      h("thead", {}, h("tr", {}, ["Date", "Instrument", "Raison", "BTC", "PnL"].map((x, k) => h("th", { class: k >= 3 ? "r" : "" }, x)))),
      h("tbody", {}, j.closed.map(c => h("tr", {},
        h("td", { class: "num" }, fdt(c.ts)), h("td", {}, c.instrument, c.lots > 1 ? h("span", { class: "muted" }, "  " + c.lots + " lots") : null),
        h("td", {}, REASON[c.reason] || c.reason), h("td", { class: "r num" }, num(c.contracts, 3)), h("td", { class: "r" }, money(c.pnl))))))
      : h("div", { class: "empty" }, "Aucune clôture sur 60 jours");
  } else {
    body = j.hedge.length ? h("table", { class: "t" },
      h("thead", {}, h("tr", {}, ["Date", "Sens", "Qté", "Prix", "Hedge après", "Réalisé"].map((x, k) => h("th", { class: k >= 2 ? "r" : "" }, x)))),
      h("tbody", {}, j.hedge.map(e => h("tr", {},
        h("td", { class: "num" }, fdt(e.ts)), h("td", {}, e.side === "BUY" ? "Achat" : "Vente"), h("td", { class: "r num" }, num(Math.abs(e.qty), 4)),
        h("td", { class: "r num" }, usd(e.price)), h("td", { class: "r num" }, sgn(e.qty_after, 4)),
        h("td", { class: "r" }, e.realized != null ? money(e.realized) : "—")))))
      : h("div", { class: "empty" }, "Aucun rebalancement");
  }
  mount("journal", h("div", { class: "cardhead" }, h("div", {}, h("h3", {}, "Journal"), h("div", { class: "sub" }, "60 derniers jours · lots d'un même événement regroupés")), tabs),
    h("div", { class: "tscroll", style: "max-height:420px;overflow:auto" }, body));
}

// ── Réconciliation (mode réel) ─────────────────────────────────────────────
function renderReconcile() {
  const r = D.reconcile;
  if (!r) { mount("reconcile"); return; }
  const ok = !r.n_mismatched && r.hedge && r.hedge.ok;
  const card = h("section", { class: "card", style: "margin-top:16px" },
    h("div", { class: "cardhead" }, h("div", {}, h("h3", {}, "Réconciliation Deribit (" + r.env + ")"), h("div", { class: "sub" }, "Bot vs compte réel · " + r.generated_at)),
      badge(ok ? "good" : "critical", ok ? "synchro" : r.n_mismatched + " écart(s)")),
    h("div", { class: "tscroll" }, h("table", { class: "t" },
      h("thead", {}, h("tr", {}, ["Instrument", "Bot", "Réel", "Écart", "Statut"].map((x, k) => h("th", { class: k && k < 4 ? "r" : "" }, x)))),
      h("tbody", {}, (r.positions || []).map(p => h("tr", {}, h("td", {}, p.instrument), h("td", { class: "r num" }, num(p.internal_qty, 4)),
        h("td", { class: "r num" }, num(p.real_qty, 4)), h("td", { class: "r num" }, sgn(p.diff, 4)), h("td", {}, badge(p.status === "ok" ? "good" : "critical", p.status))))))));
  mount("reconcile", card);
}

function renderFoot() {
  mount("foot", h("span", {}, "Généré " + fdt(D.meta.generated_at) + (tzName ? " (" + tzName + ")" : "")),
    h("span", {}, "Sources : positions.json · scan_entry.json · pnl_history.json · funding_history.jsonl · backtest_routine.json"),
    h("span", {}, "Mode " + D.meta.mode + " — aucun ordre réel"));
}

renderTop(); renderVerdict(); renderKpis(); renderEntry(); renderRisk(); renderBook();
renderRange(); renderCharts(); renderPerfStats(); renderCapYield(); renderScanner(); renderDecisions(); renderJournal(); renderReconcile(); renderFoot();
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (!document.documentElement.getAttribute("data-theme")) { renderCharts(); renderKpis(); } });
})();
</script>
