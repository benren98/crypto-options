    const bas = ex.map(e => Math.log(e.F / S0) / e.t);         // base annualisée (log) par échéance
    const tLast = ts[ts.length - 1], thLast = ths[ths.length - 1];
    const rate = (m.rate == null ? mkt.usd_rate : m.rate);

    function theta(t) {
      if (t >= tLast) return thLast * t / tLast;                // vol ATM constante au-delà de la dernière échéance
      let i = 1; while (ts[i] < t) i++;
      return ths[i - 1] + (ths[i] - ths[i - 1]) * (t - ts[i - 1]) / (ts[i] - ts[i - 1]);
    }
    function basis(t) {
      if (t <= ex[0].t) return bas[0];
      if (t >= ex[ex.length - 1].t) return bas[bas.length - 1];
      let i = 1; while (ex[i].t < t) i++;
      return bas[i - 1] + (bas[i] - bas[i - 1]) * (t - ex[i - 1].t) / (ex[i].t - ex[i - 1].t);
    }
    function wBase(k, t) {
      const th = Math.max(theta(t), 1e-10), sq = Math.sqrt(th);
      let rho = Math.max(-0.98, Math.min(0.98, (P.rho0 + P.rho1 * sq) * m.skewMult));
      let eta = Math.max(0.02, (P.eta0 + P.eta1 * sq) * m.wingMult);
      eta = Math.min(eta, 2 / (1 + Math.abs(rho)) - 1e-6);      // condition sans arbitrage papillon
      const phi = eta / (Math.pow(th, P.gamma) * Math.pow(1 + th, 1 - P.gamma));
      return th / 2 * (1 + rho * phi * k + Math.sqrt((phi * k + rho) * (phi * k + rho) + 1 - rho * rho));
    }
    function vol(k, t) {                                        // vol implicite avec décalage parallèle
      return Math.max(0.01, Math.sqrt(wBase(k, t) / t) + m.volShift / 100);
    }
    function w(k, t) { const s = vol(k, t); return s * s * t; }

      S0, rate, margins: m, vol, w,
      F: t => S0 * Math.exp((basis(t) + m.basisShift / 100) * t),
      DF: t => Math.exp(-rate * t),
    };
  }

  // Volatilité locale de Dupire en variance totale : σ² = ∂t w / [1 − k w'/w + ¼(−¼ − 1/w + k²/w²) w'² + ½ w'']
  function localVol(surf, k, t) {
    const dt = Math.min(1e-4, t / 2), dk = 1e-3;
    const w0 = surf.w(k, t), wt = (surf.w(k, t + dt) - surf.w(k, t - dt)) / (2 * dt);
    const wp = surf.w(k + dk, t), wm = surf.w(k - dk, t);

  const SUBT = [0.125, 0.375, 0.625, 0.875];
  function localVolGrid(surf, nDays) {
    const g = new Float32Array(nDays * NK);

      for (let j = 0; j < NK; j++) {

  // Pas de temps : 4 sous-pas par jour sur les 30 premiers jours (les ailes des échéances courtes ne se

  const EARLY_DAYS = 30, EARLY_SUB = 4;

  function advance(x, lv, n, off, zs, sgn) {           // fait avancer ln(S/F) d'un jour (vol locale du jour n)
    const nsub = off[n + 1] - off[n], dt = DAY / nsub, sq = Math.sqrt(dt), row = n * NK;

    condRate: 0.20, cpnBarrier: 0.70, memory: true,

    solveFor: "conditional", upfront: 0.02,                     // marge du vendeur, en % du nominal

                                                                //   ≠ spot pour valoriser un produit déjà émis (delta)
  };

  // ── Monte Carlo de l'autocall ────────────────────────────────────────────
  function price(mkt, product, margins, opts) {

    const S0 = p.refLevel > 0 ? p.refLevel : surf.S0, off = stepPlan(D);   // barrières en % de ce niveau

    const N = o.paths - (o.paths % 2), normal = rng(o.seed);

    const callCount = new Float64Array(nObs);

    // Issues : rappel anticipé · échéance sans perte · pertes en capital par tranche
    const OUT = [["Rappelé avant l'échéance", null], ["Échéance, capital rendu", 0], ["Perte 0–10 %", 0.10],
                 ["Perte 10–20 %", 0.20], ["Perte 20–40 %", 0.40], ["Perte 40–60 %", 0.60], ["Perte > 60 %", Infinity]];
    const hist = new Float64Array(OUT.length);
    const zs = new Float64Array(off[D]);

    for (let path = 0; path < N; path++) {
      if (path % 2 === 0) for (let n = 0; n < off[D]; n++) zs[n] = normal();
      const sgn = path % 2 === 0 ? 1 : -1;                      // antithétique
      let x = 0, minRatio = 1, a = 0, bc = 0, bg = 0, bank = 0, alive = true, ratio = 1;
      for (let n = 0; n < D && alive; n++) {
        x = advance(x, lv, n, off, zs, sgn);
        ratio = Fd[n + 1] * Math.exp(x) / S0;
        if (ratio < minRatio) minRatio = ratio;
        const i = obsAt[n + 1];
        if (i < 0) continue;
        const df = DFd[n + 1];
        if (i < gN && p.guaranteedRate > 0) bg += df * alpha[i];
        if (i >= condFrom) {
          if (ratio >= p.cpnBarrier) { bc += df * (alpha[i] + bank); cpnUnits += 1; bank = 0; }
          else if (p.memory) bank += alpha[i];
        }
        if (i < nObs - 1 && i + 1 >= p.firstCallObs && ratio >= acLevel[i]) {
          a += df; alive = false; callCount[i] += 1; lifeSum += days[i] * DAY;
        }
      }
      if (alive) {                                                  // échéance
        const hit = p.pdiType === "european" ? ratio <= p.pdiBarrier : minRatio <= p.pdiBarrier;
        let red = 1;
        if (hit) { ki += 1; if (ratio < p.pdiStrike) { const loss = (p.pdiStrike - ratio) / p.pdiStrike; red = 1 - loss; lossN += 1; lossSum += loss; } }
        a += DFd[D] * red; callCount[nObs - 1] += 1; lifeSum += D * DAY;
        const loss = 1 - red;
        let b = 1; if (loss > 1e-12) { b = 2; while (b < OUT.length - 1 && loss > OUT[b][1]) b++; }
        hist[b] += 1;
      } else hist[0] += 1;
      A[path] = a; Bc[path] = bc; Bg[path] = bg;
    }

    const mean = arr => { let s = 0; for (let i = 0; i < arr.length; i++) s += arr[i]; return s / arr.length; };
    const mA = mean(A), mBc = mean(Bc), mBg = mean(Bg), target = 1 - p.upfront;
    let c = p.condRate, g = p.guaranteedRate;
    if (p.solveFor === "conditional" && mBc > 1e-9) c = (target - mA - g * mBg) / mBc;
    if (p.solveFor === "guaranteed" && mBg > 1e-9) g = (target - mA - c * mBc) / mBg;
    // Erreur type sur les paires antithétiques (indépendantes entre elles)
    let s1 = 0, s2 = 0;
    for (let i = 0; i < N; i += 2) {
      const v = 0.5 * (A[i] + c * Bc[i] + g * Bg[i] + A[i + 1] + c * Bc[i + 1] + g * Bg[i + 1]);
      s1 += v; s2 += v * v;
    }
    const pairs = N / 2, pv = s1 / pairs, se = Math.sqrt(Math.max(0, s2 / pairs - pv * pv) / pairs);
    return {
      pv, se, sellerMargin: 1 - pv, condRate: c, guaranteedRate: g, target,
      parts: { redemption: mA, conditional: c * mBc, guaranteed: g * mBg, annuityCond: mBc, annuityGuar: mBg,
               zeroCoupon: DFd[D] },
      obs: days.map((d, i) => ({ day: d, t: d * DAY, alpha: alpha[i], acLevel: i + 1 >= p.firstCallObs && i < nObs - 1 ? acLevel[i] : null,
                                  callProb: callCount[i] / N })),
      probs: { autocall: 1 - callCount[nObs - 1] / N, maturity: callCount[nObs - 1] / N, ki: ki / N,
               loss: lossN / N, lossGivenLoss: lossN ? lossSum / lossN : 0 },
      expectedLife: lifeSum / N, expectedCoupons: cpnUnits / N,
      outcomes: OUT.map((o, i) => ({ label: o[0], p: hist[i] / N })),
      settings: { paths: N, seed: o.seed, days: D, nObs, rate: surf.rate, margins: surf.margins },
    };
  }

  // ── Contrôle : les vanilles du marché repricées par le Monte Carlo ───────
  function validate(mkt, margins, opts) {
    const o = Object.assign({ paths: 20000, seed: 777, maxDays: 400, moneyness: [0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.4] }, opts || {});
    const surf = makeSurface(mkt, margins);
    const exDays = Array.from(new Set(mkt.expiries.map(e => Math.max(1, Math.round(e.t * 365))).filter(d => d <= o.maxDays))).sort((a, b) => a - b);
    const D = exDays[exDays.length - 1], lv = localVolGrid(surf, D);
    const Fd = new Float64Array(D + 1); for (let n = 0; n <= D; n++) Fd[n] = surf.F(n * DAY);
    const at = new Int32Array(D + 1).fill(-1); exDays.forEach((d, i) => { at[d] = i; });
    const N = o.paths - (o.paths % 2), normal = rng(o.seed), off = stepPlan(D);
    const sums = exDays.map(() => new Float64Array(o.moneyness.length));
    const zs = new Float64Array(off[D]);
    for (let path = 0; path < N; path++) {
      if (path % 2 === 0) for (let n = 0; n < off[D]; n++) zs[n] = normal();
      const sgn = path % 2 === 0 ? 1 : -1;
      let x = 0;
      for (let n = 0; n < D; n++) {
        x = advance(x, lv, n, off, zs, sgn);
        const e = at[n + 1];
        if (e >= 0) {
          const S = Fd[n + 1] * Math.exp(x);
          o.moneyness.forEach((m, q) => { const K = m * Fd[n + 1]; sums[e][q] += m < 1 ? Math.max(K - S, 0) : Math.max(S - K, 0); });
        }
      }
    }
    return exDays.map((d, e) => {
      const t = d * DAY, F = Fd[d];
      return { day: d, t, F, points: o.moneyness.map((m, q) => {
        const K = m * F, call = m >= 1, mc = sums[e][q] / N;
        const ivMkt = surf.vol(Math.log(m), t), ivMc = impliedVol(mc, F, K, t, call);
        return { m, K, ivSurface: ivMkt, ivMc, errVolPts: ivMc == null ? null : (ivMc - ivMkt) * 100 };
      }) };
    });
  }

  const API = { price, validate, makeSurface, localVol, schedule, b76, impliedVol, DEFAULT_PRODUCT, DEFAULT_MARGINS, FREQ_DAYS };

})(typeof self !== "undefined" ? self : this);

// ── Calcul dans un Web Worker (l'interface reste fluide) ──────────────────
let worker = null, jobSeq = 0;
const pending = new Map();
try {
  const src = document.getElementById("engine").textContent +
    "\nself.onmessage = function (e) { var d = e.data; try { var r = d.kind === 'validate' ? AutocallEngine.validate(d.mkt, d.margins, d.opts)" +
    " : AutocallEngine.price(d.mkt, d.product, d.margins, d.opts); self.postMessage({ id: d.id, ok: true, r: r }); }" +
    " catch (err) { self.postMessage({ id: d.id, ok: false, err: String(err) }); } };";
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
  worker.onmessage = (e) => { const p = pending.get(e.data.id); if (p) { pending.delete(e.data.id); e.data.ok ? p.res(e.data.r) : p.rej(e.data.err); } };
} catch (e) { worker = null; }
function run(kind, product, margins, opts) {
  const id = ++jobSeq;
  return new Promise((res, rej) => {
    if (worker) { pending.set(id, { res, rej }); worker.postMessage({ id, kind, mkt: MKT, product, margins, opts }); }
    else setTimeout(() => { try { res(kind === "validate" ? E.validate(MKT, margins, opts) : E.price(MKT, product, margins, opts)); } catch (err) { rej(String(err)); } }, 20);
  });
}

      h("td", { class: "r num" }, pc(o.callProb, 2)), h("td", { class: "r num" }, pc(cum, 1)));
  });
  const table = h("div", { class: "tscroll", style: "max-height:360px;overflow:auto" }, h("table", { class: "t" },
    h("thead", {}, h("tr", {}, ["N°", "Date", "Mois", "Barrière de rappel", "Coupon garanti", "Coupon conditionnel", "Proba. de sortie", "Cumul"].map((x, i) => h("th", { class: i > 2 ? "r" : "" }, x)))),
    h("tbody", {}, rows)));
  mount("sched", h("div", { class: "cardhead" }, h("div", {}, h("h3", {}, "Échéancier"),

    r.obs.length > 24 ? h("details", { class: "dt" }, h("summary", {}, "Afficher les " + r.obs.length + " dates"), table) : table);
}

// ── Sensibilités du coupon aux marges (même graine : écarts nets du bruit) ───
let sensRunning = false, delta = null;
function renderSens(rows) {
  const intro = h("div", { class: "sub" }, "Effet de chaque marge sur le résultat, toutes choses égales par ailleurs. En vendeur, être prudent = choisir le sens qui baisse le coupon.");
  const btn = h("button", { class: "btn", disabled: sensRunning ? "" : null, onclick: computeSens }, sensRunning ? "Calcul…" : "Calculer les sensibilités");
  let body = h("div", { class: "empty", style: "min-height:60px" }, "6 simulations supplémentaires (quelques secondes)");
  if (rows) {
    const unit = RQ.product.solveFor === "none" ? "valeur" : "coupon";
    body = h("div", { class: "tscroll" }, h("table", { class: "t sensgrid" },
      h("thead", {}, h("tr", {}, ["Choc", unit === "coupon" ? "Coupon équitable" : "Valeur", "Écart", "Marge prudente pour le vendeur"].map((x, i) => h("th", { class: i ? "r" : "" }, x)))),
      h("tbody", {}, rows.map(x => h("tr", {}, h("td", {}, x.label), h("td", { class: "r num" }, pc(x.val)), h("td", { class: "r num " + tone(x.diff) }, (x.diff >= 0 ? "+" : "") + num(x.diff * 100, 2) + " pt"),
        h("td", { class: "r" }, x.hint))))),
      delta ? h("div", { class: "callout" }, h("b", {}, "Delta du vendeur (produit émis) : "),
        "si le BTC monte de 1 %, la valeur des flux promis varie de " + (delta.dPV >= 0 ? "+" : "") + num(delta.dPV * 100, 3) + " pt du nominal, soit ",
        money(-delta.dPV * S.notional), " pour vous. Couverture : " + (delta.hedge >= 0 ? "acheter " : "vendre ") + num(Math.abs(delta.hedge), 3) + " BTC (perp) pour être neutre.") : null);
  }
  mount("sens", h("div", { class: "cardhead" }, h("div", {}, h("h3", {}, "Sensibilités aux paramètres du modèle"), intro), btn), body);
}
async function computeSens() {
  if (!R || sensRunning) return;
  sensRunning = true; delta = null; renderSens(null);
  const q = toEngine(), key = q.product.solveFor === "guaranteed" ? "guaranteedRate" : q.product.solveFor === "conditional" ? "condRate" : "pv";
  const base = R[key];
  const shocks = [["Vol +1 pt", { volShift: q.margins.volShift + 1 }, "vol"], ["Skew × 1,10", { skewMult: q.margins.skewMult * 1.1 }, "skew"],
                  ["Ailes × 1,10", { wingMult: q.margins.wingMult * 1.1 }, "ailes"], ["Base +1 %/an", { basisShift: q.margins.basisShift + 1 }, "base"],
                  ["Taux USD +0,5 %", { rate: q.margins.rate + 0.005 }, "taux"]];
  const rows = [];
  for (const [label, m, kind] of shocks) {
    const r = await run("price", q.product, Object.assign({}, q.margins, m), q.opts);
    const diff = r[key] - base;
    const lowerIsPrudent = key !== "pv";     // vendeur : coupon plus bas = prudent ; en valorisation, valeur plus haute = prudent
    const prudentUp = lowerIsPrudent ? diff < 0 : diff > 0;
    const hint = Math.abs(diff) < 1e-5 ? "sans effet" : (prudentUp ? "marge à la hausse (" + kind + " plus haut)" : "marge à la baisse (" + kind + " plus bas)");
    rows.push({ label, val: r[key], diff, hint });
  }
  // Delta du vendeur sur un produit déjà émis : spot ET forwards +1 %, barrières figées au niveau initial,
  // coupons figés à leur valeur actuelle → variation de la valeur des flux promis (le vendeur en est court).
  const fixed = Object.assign({}, q.product, { solveFor: "none", refLevel: MKT.spot, condRate: R.condRate, guaranteedRate: R.guaranteedRate });
  const up = Object.assign({}, MKT, { spot: MKT.spot * 1.01, expiries: MKT.expiries.map(e => Object.assign({}, e, { F: e.F * 1.01 })) });
  const r0 = await run("price", fixed, q.margins, q.opts);
  const r1 = await new Promise((res, rej) => { try { res(E.price(up, fixed, q.margins, q.opts)); } catch (e) { rej(e); } });
  const dPV = r1.pv - r0.pv;
  delta = { dPV, hedge: dPV * S.notional / (0.01 * MKT.spot) };   // BTC à acheter (> 0) pour neutraliser le delta vendeur
  sensRunning = false; renderSens(rows);
}

// ── Marché : smile et structure par terme ──────────────────────────────────
let smileIdx = Math.min(MKT.expiries.length - 1, Math.max(0, MKT.expiries.findIndex(e => e.t * 365 >= 85)));
function renderSmile() {
  const e = MKT.expiries[smileIdx];
  const base = E.makeSurface(MKT, {}), marged = E.makeSurface(MKT, RQ ? RQ.margins : toEngine().margins);
  const mny = [], fitB = [], fitM = [];
  const kLo = Math.min(...e.quotes.map(q => q[1])), kHi = Math.max(...e.quotes.map(q => q[1]));
  for (let i = 0; i <= 60; i++) { const k = kLo + (kHi - kLo) * i / 60; mny.push(Math.exp(k) * 100); fitB.push(base.vol(k, e.t) * 100); fitM.push(marged.vol(k, e.t) * 100); }
  const anyMargin = RQ && (RQ.margins.volShift || RQ.margins.skewMult !== 1 || RQ.margins.wingMult !== 1);
  killChart("smile");
  const sel = h("select", { "aria-label": "Échéance", onchange: ev => { smileIdx = Number(ev.target.value); renderSmile(); } },
    MKT.expiries.map((x, i) => h("option", { value: i, selected: i === smileIdx ? "" : null }, fdate(x.expiry) + " · " + num(x.t * 365, 0) + " j")));
  const items = [{ name: "Marché (mark)", color: css("--s1"), kind: "rect" }, { name: "Bid / ask", color: css("--muted"), kind: "rect" }, { name: "Surface SSVI", color: css("--s3") }];
  if (anyMargin) items.push({ name: "Avec vos marges", color: css("--s2") });
  chartCard("smile", "Smile de volatilité", "échéance du " + fdate(e.expiry) + " · forward " + usd(e.F) + " · écart du fit " + num(e.rmse_volpts, 2) + " pt", items, box => {
    box.parentNode.insertBefore(h("div", { class: "selrow", style: "margin-bottom:8px" }, h("span", { class: "muted small" }, "Échéance"), sel), box);
    const c = canvasIn(box, "Smile");
    const pts = e.quotes.map(q => ({ x: Math.exp(q[1]) * 100, y: q[2] }));
    const bid = e.quotes.filter(q => q[3] != null).map(q => ({ x: Math.exp(q[1]) * 100, y: q[3] }));
    const ask = e.quotes.filter(q => q[4] != null).map(q => ({ x: Math.exp(q[1]) * 100, y: q[4] }));
    const ds = [
      { type: "scatter", label: "Marché (mark)", data: pts, backgroundColor: css("--s1"), pointRadius: 3.5 },
      { type: "scatter", label: "Bid", data: bid, backgroundColor: css("--muted"), pointRadius: 2, pointStyle: "line", borderColor: css("--muted") },
      { type: "scatter", label: "Ask", data: ask, backgroundColor: css("--muted"), pointRadius: 2, pointStyle: "line", borderColor: css("--muted") },
      Object.assign(lineDs("Surface SSVI", mny.map((x, i) => ({ x, y: fitB[i] })), css("--s3")), { type: "line" }),
    ];
    if (anyMargin) ds.push(Object.assign(lineDs("Avec vos marges", mny.map((x, i) => ({ x, y: fitM[i] })), css("--s2")), { type: "line", borderDash: [6, 4] }));
    CHARTS.push(new Chart(c, { type: "scatter", data: { datasets: ds },
      options: { maintainAspectRatio: false, animation: false, plugins: { legend: { display: false },
        tooltip: tooltipOpts(v => num(v, 1) + " %", x => "strike " + num(x, 0) + " % du forward") },
        scales: Object.assign(axes(v => num(v, 0) + " %", v => num(v, 0) + " %", { time: true }), {}) } }));
  });
}
function renderTerm() {
  killChart("term");
  const ex = MKT.expiries, surf = E.makeSurface(MKT, {});
  chartCard("term", "Structure par terme", "vol ATM implicite par échéance (base des futures en tableau)", null, box => {
    const c = canvasIn(box, "Structure par terme");

        scales: axes(v => num(v, 0) + " %", v => num(v, 0) + " j", { time: true }) } }));

// ── Contrôle du modèle : vanilles repricées par le Monte Carlo ─────────────
function renderValid(v, running) {
  const btn = h("button", { class: "btn", disabled: running ? "" : null, onclick: computeValid }, running ? "Calcul…" : "Contrôler le modèle");
  let body = h("div", { class: "empty", style: "min-height:60px" },
    "Reprice les options du marché avec le moteur (vol locale + Monte Carlo) et affiche l'écart en points de vol. Écart attendu : < 1 pt sur les strikes utiles.");
  if (v) {
    const ms = v[0].points.map(p => p.m);
    body = h("div", { class: "tscroll" }, h("table", { class: "t valgrid" },
      h("thead", {}, h("tr", {}, [h("th", {}, "Échéance")].concat(ms.map(m => h("th", { class: "r" }, num(m * 100, 0) + " %"))))),
      h("tbody", {}, v.map(e => {
        const sd = e.points.find(p => p.m === 1).ivSurface * Math.sqrt(e.t);
        return h("tr", {}, h("td", { class: "num" }, num(e.day, 0) + " j"),
          e.points.map(p => { const off = e.day < 7 || Math.abs(Math.log(p.m)) > 2.5 * sd;
            return h("td", { class: "r num " + (off ? "off" : Math.abs(p.errVolPts) > 1 ? "neg" : "") }, p.errVolPts == null ? "—" : (p.errVolPts >= 0 ? "+" : "") + num(p.errVolPts, 2)); }));
      }))),

  }
  mount("valid", h("div", { class: "cardhead" }, h("div", {}, h("h3", {}, "Contrôle du modèle"), h("div", { class: "sub" }, "Les vanilles cotées sont-elles bien repricées ?")), btn), body);
}
function computeValid() {
  renderValid(null, true);

  run("validate", null, q.margins, { paths: 30000, seed: 777 }).then(v => renderValid(v, false)).catch(err => mount("valid", h("div", { class: "err" }, String(err))));
